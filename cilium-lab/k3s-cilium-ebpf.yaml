# k3s-cilium-ebpf.yaml
# Create:  limactl create --name k3s-ebpf ./k3s-cilium-ebpf.yaml
# Start:   limactl start k3s-ebpf
# Shell:   limactl shell k3s-ebpf

arch: "x86_64"
images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    arch: "x86_64"

cpus: 4
memory: "8GiB"
disk: "40GiB"


mounts:
- location: "~"
  writable: true

containerd:
  system: true

# Expose ingress + hubble-ui to host
portForwards:
  # Cilium ingress (NodePort inside VM)
  - guestPort: 30080
    hostPort: 8080
  - guestPort: 30443
    hostPort: 8443
  # Hubble UI port-forward inside VM (optional)
  - guestPort: 12000
    hostPort: 12000

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive

      apt-get update
      apt-get install -y --no-install-recommends \
        ca-certificates curl jq iproute2 iptables \
        gnupg lsb-release apt-transport-https

      # --- kernel/sysctl for Kubernetes/CNI ---
      cat >/etc/modules-load.d/k8s.conf <<'EOF'
      overlay
      br_netfilter
      EOF
      modprobe overlay || true
      modprobe br_netfilter || true

      cat >/etc/sysctl.d/k8s.conf <<'EOF'
      net.bridge.bridge-nf-call-iptables=1
      net.bridge.bridge-nf-call-ip6tables=1
      net.ipv4.ip_forward=1
      EOF
      sysctl --system

      # Swap off (required by kubelet)
      swapoff -a || true
      sed -i '/\sswap\s/d' /etc/fstab || true

      # --- Install k3s: custom CNI, no kube-proxy, no traefik ---
      # NOTE: This is what makes Cilium do eBPF service LB (kube-proxy replacement strict)
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_EXEC="server \
          --flannel-backend=none \
          --disable-network-policy \
          --disable-kube-proxy \
          --disable traefik" \
        sh -

      # Wait for apiserver
      for i in $(seq 1 90); do
        if kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes >/dev/null 2>&1; then
          break
        fi
        sleep 2
      done
      chmod 0644 /etc/rancher/k3s/k3s.yaml

      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      # --- Install Cilium CLI ---
      CILIUM_CLI_VERSION="$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)"
      CLI_ARCH=amd64
      curl -L --fail --remote-name-all \
        "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz" \
        "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz.sha256sum"
      sha256sum --check "cilium-linux-${CLI_ARCH}.tar.gz.sha256sum"
      tar -C /usr/local/bin -xzvf "cilium-linux-${CLI_ARCH}.tar.gz"
      rm -f "cilium-linux-${CLI_ARCH}.tar.gz" "cilium-linux-${CLI_ARCH}.tar.gz.sha256sum"

      # --- Install Cilium in full eBPF LB mode + Envoy ingress + Hubble UI ---
      # k8sServiceHost/Port: k3s apiserver is reachable on localhost inside the VM
      cilium install \
        --set kubeProxyReplacement=true \
        --set k8sServiceHost=127.0.0.1 \
        --set k8sServicePort=6443 \
        --set hubble.enabled=true \
        --set hubble.relay.enabled=true \
        --set hubble.ui.enabled=true \
        --set envoy.enabled=true \
        --set ingressController.enabled=true \
        --set ingressController.loadbalancerMode=shared

      cilium status --wait

      # --- Expose Cilium Ingress to host via NodePort inside VM ---
      # Find the ingress service name (varies by version/chart)
      INGSVC="$(kubectl -n kube-system get svc -o name | grep -E 'cilium.*ingress|ingress.*cilium|cilium-envoy' | head -n1 | sed 's#service/##')"
      if [ -n "${INGSVC}" ]; then
        kubectl -n kube-system patch svc "${INGSVC}" -p '{
          "spec": {
            "type":"NodePort",
            "ports":[
              {"name":"http","port":80,"targetPort":80,"nodePort":30080},
              {"name":"https","port":443,"targetPort":443,"nodePort":30443}
            ]
          }
        }' || true
      fi

      # --- Convenience: Hubble UI port-forward inside VM to 12000 (Lima forwards to host) ---
      # If the hubble-ui service exists, keep a simple background port-forward.
      if kubectl -n kube-system get svc hubble-ui >/dev/null 2>&1; then
        nohup kubectl -n kube-system port-forward svc/hubble-ui 12000:80 >/var/log/hubble-ui.pf.log 2>&1 &
      fi
