# k3s-cilium.yaml
# Create:  limactl create --name k3s-cilium ./k3s-cilium.yaml
# Start:   limactl start k3s-cilium
# Shell:   limactl shell k3s-cilium

arch: "x86_64"

images:
  - location: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
    arch: "x86_64"

cpus: 4
memory: "8GiB"
disk: "40GiB"

qemu:
  args:
    - -accel
    - tcg

mounts:
  - location: "~"
    writable: true

# Recommended for k8s workloads
containerd:
  system: true

# Optional: expose Ingress/HTTP(S) from VM to host
portForwards:
  - guestPort: 30080
    hostPort: 8080
  - guestPort: 30443
    hostPort: 8443

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail

      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends \
        ca-certificates curl jq iproute2 iptables \
        gnupg lsb-release \
        apt-transport-https

      # ---- Kernel/sysctl prep for CNI/eBPF ----
      cat >/etc/modules-load.d/k8s.conf <<'EOF'
      overlay
      br_netfilter
      EOF
      modprobe overlay || true
      modprobe br_netfilter || true

      cat >/etc/sysctl.d/k8s.conf <<'EOF'
      net.bridge.bridge-nf-call-iptables=1
      net.bridge.bridge-nf-call-ip6tables=1
      net.ipv4.ip_forward=1
      EOF
      sysctl --system

      # ---- Install k3s WITHOUT Flannel (we will install Cilium) ----
      # k3s docs: custom CNI -> --flannel-backend=none (+ disable network policy) :contentReference[oaicite:2]{index=2}
      curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --flannel-backend=none --disable-network-policy" sh -

      # Wait for apiserver
      for i in $(seq 1 60); do
        if kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes >/dev/null 2>&1; then
          break
        fi
        sleep 2
      done

      chmod 0644 /etc/rancher/k3s/k3s.yaml

      # ---- Install Cilium CLI ----
      # Use official script path from Cilium docs (stable) :contentReference[oaicite:3]{index=3}
      CILIUM_CLI_VERSION="$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)"
      CLI_ARCH=amd64
      curl -L --fail --remote-name-all \
        "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz" \
        "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz.sha256sum"
      sha256sum --check "cilium-linux-${CLI_ARCH}.tar.gz.sha256sum"
      tar -C /usr/local/bin -xzvf "cilium-linux-${CLI_ARCH}.tar.gz"
      rm -f "cilium-linux-${CLI_ARCH}.tar.gz" "cilium-linux-${CLI_ARCH}.tar.gz.sha256sum"

      # ---- Install Cilium (basic) ----
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      # Minimal install. Good default for first boot.
      cilium install

      # Wait until ready
      cilium status --wait
